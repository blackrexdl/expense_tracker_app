{% extends 'base.html' %}{% block content %}<section class="auth side-card"><h1>Settings</h1><form method="post"><input type="hidden" name="action" value="settings"><label>Currency<input name="currency" maxlength="3" value="{{setting.currency if setting else '₹'}}"></label><label>Theme<select name="theme"><option value="dark">Dark</option><option value="light">Light</option></select></label><label>Default monthly budget<input name="monthly_budget" type="number" step="0.01" value="{{setting.monthly_budget if setting and setting.monthly_budget else ''}}"></label><button>Save settings</button></form><hr><h2>Change password</h2><form method="post"><input type="hidden" name="action" value="password"><input name="current_password" type="password" placeholder="Current password" required><input name="new_password" type="password" minlength="8" placeholder="New password (8+ characters)" required><button>Change password</button></form><p><a href="/manage">← Manage finances</a></p></section>{%endblock%}
