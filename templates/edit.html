{% extends 'base.html' %}{% block content %}
<section class="card auth">
  <h1>Edit transaction</h1>
  <form method="post">
    <select name="kind" id="kind">
      <option value="expense" {% if transaction.kind == 'expense' %}selected{% endif %}>
        Expense
      </option>
      <option value="income" {% if transaction.kind == 'income' %}selected{% endif %}>
        Income
      </option></select
    ><select name="category_id" id="category">
      {%for c in categories%}
      <option value="{{ c.id }}" data-kind="{{ c.kind }}" {% if c.id == transaction.category_id %}selected{% endif %}>
        {{c.name}}
      </option>
      {%endfor%}</select
    ><input
      name="amount"
      type="number"
      min="0.01"
      step="0.01"
      value="{{transaction.amount}}"
      required
    /><input
      name="transaction_date"
      type="date"
      value="{{transaction.transaction_date}}"
      required
    /><input name="note" value="{{transaction.note}}" /><button>Update</button>
  </form>
  <p><a href="/">Cancel</a></p>
</section>
<script src="{{url_for('static',filename='app.js')}}"></script>
{%endblock%}
